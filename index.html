<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Pokemon Game</title>
</head>
<body>

    <!-- Difficulty selection menu -->
<div id="difficultyMenu">
    <h1>Pokémon Collector</h1>
    <h2>Select Difficulty</h2>

    <button onclick="startGame('easy')">Easy</button>
    <button onclick="startGame('medium')">Medium</button>
    <button onclick="startGame('hard')">Hard</button>
</div>

    <!-- Display the player's score -->
    <div class="score-container">
        <h2>Pokéballs: <span id="score">0</span>/<span id="targetScore">20</span></h2>
    </div>

    <!-- Display the countdown timer -->
    <div class="timer-container">
        <h2>Time: <span id="timer">60</span>s</h2>
    </div>

    <!-- Button to pause and resume the game -->
    <button id="pauseButton">Pause (P)</button>

    <!-- Pause menu displayed when the game is paused -->
    <div class="pause-menu" id="pauseMenu">
        <div class="pause-content">
            <h1>Game Paused</h1>
            <p>Take a break! Your progress is saved for this round.</p>
            <button id="resumeButton">Resume Game</button>

            <!-- Restart the game from the difficulty selection menu -->
            <button id="pauseRestartButton">Restart Game</button>
        </div>
    </div>

    <!-- Game over / victory screen -->
<!-- Game Over / Victory Screen -->
<div class="game-over-screen" id="gameOverScreen">
    <h1 id="gameResult">Game Over!</h1>
    <p id="finalScore"></p>

    <!-- Button to restart the game -->
    <button id="restartButton">Play Again</button>
</div>

    <!-- Player character -->
    <div class="player"></div>

    <script src="script.js"></script>
</body>
</html>
